<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet" />

    <link rel="icon" href="./img/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="layout.css" />
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="index.js" defer></script>
    <!-- <script type="module" src="weather_open_meteo.js" defer></script> -->

    <title>To Do-app</title>
  </head>

  <body>
    <main class="app">
      <!-- Appens overskrift -->
      <header class="hero">
        <img src="./img/todo-logo.svg" alt="To Do-logo" />
        <h1>Få styr på dit<br />renegade liv</h1>
      </header>

      <!-- Formular til en ny opgave -->
      <section class="new-task-section">
        <form id="task-form" class="task-form">
          <input id="task-text" class="task_text" type="text" placeholder="Skriv hvilken opgave du skal have udført her" aria-label="Ny opgave" />

          <div class="task-options">
            <input id="task-date" type="date" value="2026-09-10" aria-label="Opgavens dato" />

            <label class="option">
              <span>Indendørs</span>
              <input type="radio" name="task-location" value="indoor" checked />
            </label>

            <label class="option">
              <span>Udendørs</span>
              <input id="task-outdoor" type="radio" name="task-location" value="outdoor" />
            </label>
          </div>

          <!-- Knappen venter på din JavaScript. -->
          <button class="create_task button" type="button">Tilføj opgave</button>
        </form>

        <!-- Her kan JavaScript senere vise fejl og andre beskeder. -->
      </section>

      <div class="divider">
        <p id="feedback"></p>
      </div>

      <!-- Aktive opgaver -->
      <section class="task-section todo-section">
        <h2>To do</h2>

        <ul id="todo-list" class="tasks task-list">
          <li class="task"></li>
        </ul>
      </section>

      <!-- Færdige opgaver -->
      <section class="task-section done-section">
        <h2>Done</h2>

        <ul id="done-list" class="task-list done-list">
          <li class="task done-task"></li>
        </ul>
      </section>
    </main>
  </body>
</html>
